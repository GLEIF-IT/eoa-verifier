[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eoa-verifier"
version = "0.1.0"
description = "KERI credential and Ethereum EOA association verification"
readme = "README.md"
requires-python = ">=3.12.6"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["gleif_keri==1.2.19", "gleif_hio==0.6.22", "eth-account==0.14.0"]

[project.urls]
Repository = "https://github.com/GLEIF-IT/eoa-verifier"
Documentation = "https://github.com/GLEIF-IT/eoa-verifier/blob/master/docs/operations.md"

[project.optional-dependencies]
test = ["pytest>=9"]

[project.scripts]
eoa-verifier = "eoa_verifier.runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"eoa_verifier.verification" = ["schema_data/*.json"]
