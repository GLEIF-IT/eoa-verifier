name: Tests
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  installed-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.5.1
          cache: false
      - name: Build and install wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv "$RUNNER_TEMP/verifier-tests"
          "$RUNNER_TEMP/verifier-tests/bin/python" -m pip install dist/*.whl pytest jsonschema==4.26.0
      - name: Test installed package outside checkout
        run: |
          mkdir "$RUNNER_TEMP/qualification"
          cp -R tests protocol scripts "$RUNNER_TEMP/qualification/"
          cp pytest.ini "$RUNNER_TEMP/qualification/"
          cd "$RUNNER_TEMP/qualification"
          export EOA_VERIFIER_WHEEL="$(find "$GITHUB_WORKSPACE/dist" -name 'eoa_verifier-*.whl' -print -quit)"
          anvil --version
          "$RUNNER_TEMP/verifier-tests/bin/eoa-verifier" server start --help
          "$RUNNER_TEMP/verifier-tests/bin/python" -m pytest -q tests
